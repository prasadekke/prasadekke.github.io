<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stocks Watchlist</title>
  <meta name="description" content="Watchlist for Broadcom (AVGO), Meta (META) and memory stocks Micron, SanDisk, Western Digital, Samsung and SK hynix, with charts, market cap, P/E and 52-week range.">
  <link rel="canonical" href="https://prasadekke.github.io/stocks.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Prasad's Homepage">
  <meta property="og:title" content="Stocks Watchlist">
  <meta property="og:description" content="Watchlist for Broadcom (AVGO), Meta (META) and memory stocks Micron, SanDisk, Western Digital, Samsung and SK hynix, with charts, market cap, P/E and 52-week range.">
  <meta property="og:url" content="https://prasadekke.github.io/stocks.html">
  <meta property="og:image" content="https://prasadekke.github.io/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebPage", "name": "Stocks Watchlist", "url": "https://prasadekke.github.io/stocks.html"}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Selected stock (price, chart, key stats) on the left; the grouped watchlist on the right */
    :root {
      --bg: #f6f7f4;
      --paper: #ffffff;
      --ink: #1d2321;
      --muted: #66706b;
      --rule: #e2e6e1;
      --accent: #1f8a7a;
      --up: #1f7a4d;
      --up-soft: rgba(31, 122, 77, 0.10);
      --down: #b23a26;
      --down-soft: rgba(178, 58, 38, 0.10);
      --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111513;
        --paper: #181d1b;
        --ink: #e6ebe8;
        --muted: #8f9a95;
        --rule: #2a312e;
        --accent: #4cc2ae;
        --up: #5cc28c;
        --up-soft: rgba(92, 194, 140, 0.14);
        --down: #ef7558;
        --down-soft: rgba(239, 117, 88, 0.14);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111513;
      --paper: #181d1b;
      --ink: #e6ebe8;
      --muted: #8f9a95;
      --rule: #2a312e;
      --accent: #4cc2ae;
      --up: #5cc28c;
      --up-soft: rgba(92, 194, 140, 0.14);
      --down: #ef7558;
      --down-soft: rgba(239, 117, 88, 0.14);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px));
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--muted); }
    .back { font-size: 13px; color: var(--muted); text-decoration: none; }
    h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
    .updated { color: var(--muted); font-size: 13px; margin: 2px 0 0; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      min-width: 0;
    }

    /* Detail */
    .detail { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .d-name { font-size: 20px; font-weight: 600; margin: 0; }
    .d-sym { font-size: 13px; color: var(--muted); font-family: var(--mono); }
    .d-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
    .d-price .big { font-family: var(--mono); font-size: clamp(30px, 6vw, 40px); font-weight: 500; font-variant-numeric: tabular-nums; }
    .d-price .cur { font-size: 14px; color: var(--muted); }
    .move { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
    .move.up { color: var(--up); }
    .move.down { color: var(--down); }
    .move .when { font-family: var(--sans); color: var(--muted); font-size: 13px; margin-left: 4px; }
    .d-note { font-size: 12.5px; color: var(--muted); margin-top: -10px; }

    .ranges { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--rule); }
    .ranges button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 10px 9px;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .ranges button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: 260px; overflow: visible; touch-action: pan-y; }
    .chart .grid line { stroke: var(--rule); }
    .chart .tick { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
    .chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .chart .prev { stroke: var(--muted); stroke-dasharray: 2 4; stroke-width: 1; }
    .chart .prev-label { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
    .chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .chart .hover-dot { stroke: var(--paper); stroke-width: 2; }
    .chart.up .series { stroke: var(--up); }
    .chart.up .hover-dot { fill: var(--up); }
    .chart.up .area { fill: var(--up-soft); }
    .chart.down .series { stroke: var(--down); }
    .chart.down .hover-dot { fill: var(--down); }
    .chart.down .area { fill: var(--down-soft); }
    .tip {
      position: absolute;
      top: 0;
      pointer-events: none;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      white-space: nowrap;
    }
    .tip .t { color: var(--muted); font-size: 12px; }
    .tip .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .chart svg:focus-visible, .ranges button:focus-visible, .row:focus-visible, .status button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 28px;
      margin: 0;
    }
    .stats div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
    .stats dt { color: var(--muted); font-size: 14px; }
    .stats dd { margin: 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }

    /* Watchlist */
    .list { overflow: hidden; }
    .group {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 14px 16px 6px;
      margin: 0;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px auto;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
    }
    .row:hover { background: var(--bg); }
    .row[aria-current="true"] { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
    .row .sym { font-family: var(--mono); font-size: 13px; font-weight: 500; }
    .row .nm { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row svg { width: 64px; height: 28px; display: block; }
    .row svg path { fill: none; stroke-width: 1.5; }
    .row.up svg path { stroke: var(--up); }
    .row.down svg path { stroke: var(--down); }
    .row .px { text-align: right; font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
    .chip {
      display: inline-block;
      margin-top: 2px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .up .chip { color: var(--up); background: var(--up-soft); }
    .down .chip { color: var(--down); background: var(--down-soft); }

    .status { padding: 20px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status button {
      font: inherit;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }

    .foot { font-size: 12.5px; color: var(--muted); margin: 0; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .chart svg { height: 220px; }
      .stats { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <a class="back" href="./">← Prasad's Homepage</a>
      <h1>Stocks Watchlist</h1>
      <p class="updated" id="updated">Loading prices…</p>
    </div>

    <div class="layout">
      <section class="card detail" id="detail" aria-live="polite">
        <div class="status" id="status">Loading prices…</div>
        <div id="detailBody" hidden>
          <div>
            <h2 class="d-name" id="dName"></h2>
            <span class="d-sym" id="dSym"></span>
          </div>
          <div class="d-price">
            <span class="big" id="dPrice"></span>
            <span class="move" id="dMove"></span>
          </div>
          <div class="d-note" id="dNote"></div>
          <div class="ranges" role="group" aria-label="Chart range">
            <button type="button" data-r="1D">1D</button>
            <button type="button" data-r="5D">5D</button>
            <button type="button" data-r="1M">1M</button>
            <button type="button" data-r="6M">6M</button>
            <button type="button" data-r="YTD">YTD</button>
            <button type="button" data-r="1Y">1Y</button>
            <button type="button" data-r="5Y">5Y</button>
          </div>
          <div class="chart" id="chart">
            <svg id="svg" tabindex="0" role="img" aria-label="Price chart. Use left and right arrow keys to read values."></svg>
            <div class="tip" id="tip" hidden></div>
          </div>
          <dl class="stats" id="stats"></dl>
        </div>
      </section>

      <nav class="card list" id="list" aria-label="Watchlist"></nav>
    </div>

    <p class="foot">Prices from Yahoo Finance, fetched about every 15 minutes while markets are open, so they can be delayed. Samsung and SK hynix trade in Seoul and are priced in won. Not investment advice.</p>
  </div>

  <script>
    "use strict";
    const DATA_URL = 'https://raw.githubusercontent.com/prasadekke/prasadekke.github.io/data/stocks.json';
    const NAMES = { '005930.KS': 'Samsung Electronics', '000660.KS': 'SK hynix' };
    const $ = id => document.getElementById(id);

    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function save(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }

    const state = { data: null, stocks: [], current: null, range: load('stocks:range') || '1D', points: [], hover: -1 };

    // ---------- formatting ----------
    const tzFor = s => /\.KS$/.test(s.symbol) ? 'Asia/Seoul' : 'America/New_York';
    const nameOf = s => NAMES[s.symbol] || s.name;
    function money(v, cur) {
      if (v == null) return '—';
      const digits = cur === 'KRW' || cur === 'JPY' ? 0 : 2;
      return v.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }
    function compact(v, cur) {
      if (v == null) return '—';
      return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(v) + (cur ? ' ' + cur : '');
    }
    const signed = (v, f) => (v > 0 ? '+' : v < 0 ? '−' : '') + f(Math.abs(v));
    const dirOf = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
    function moveText(change, pct, cur) {
      const arrow = change > 0 ? '▲ ' : change < 0 ? '▼ ' : '';
      return `${arrow}${signed(change, v => money(v, cur))} (${signed(pct, v => v.toFixed(2))}%)`;
    }

    // ---------- data ----------
    async function fetchData() {
      try {
        const res = await fetch(DATA_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error(res.status);
        state.data = await res.json();
      } catch (e) {
        if (!state.data) {
          const s = $('status');
          s.innerHTML = "Couldn't load prices. Check your connection, then ";
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = 'try again';
          b.addEventListener('click', fetchData);
          s.append(b);
          $('updated').textContent = '';
        }
        return;
      }
      state.stocks = state.data.groups.flatMap(g => g.stocks);
      const when = new Date(state.data.generated);
      $('updated').textContent = 'Updated ' + when.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
      renderList();
      selectFromHash();
    }

    // ---------- watchlist ----------
    function sparkPath(series, w, h) {
      if (!series || series.length < 2) return '';
      const vals = series.map(p => p[1]);
      const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
      return 'M' + vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(2 + (1 - (v - lo) / span) * (h - 4)).toFixed(1)}`).join('L');
    }

    function renderList() {
      const list = $('list');
      list.innerHTML = state.data.groups.map(g => `
        <h2 class="group">${g.name}</h2>
        ${g.stocks.map(s => `
          <a class="row ${dirOf(s.change)}" href="#${s.symbol}" data-sym="${s.symbol}">
            <span><span class="sym">${s.symbol.replace(/\.KS$/, '')}</span><span class="nm">${nameOf(s)}</span></span>
            <svg viewBox="0 0 64 28" aria-hidden="true"><path d="${sparkPath(s.series['1D'], 64, 28)}"/></svg>
            <span class="px">${money(s.price, s.currency)}<br><span class="chip">${signed(s.changePct, v => v.toFixed(2))}%</span></span>
          </a>`).join('')}`).join('');
    }

    function selectFromHash() {
      const sym = decodeURIComponent(location.hash.slice(1));
      const s = state.stocks.find(x => x.symbol === sym) || state.stocks.find(x => x.symbol === load('stocks:last')) || state.stocks[0];
      if (!s) return;
      state.current = s;
      save('stocks:last', s.symbol);
      document.querySelectorAll('.row').forEach(r => r.setAttribute('aria-current', String(r.dataset.sym === s.symbol)));
      renderDetail();
    }

    // ---------- detail ----------
    function renderDetail() {
      const s = state.current, cur = s.currency;
      $('status').hidden = true;
      $('detailBody').hidden = false;
      $('dName').textContent = nameOf(s);
      $('dSym').textContent = `${s.symbol} · ${s.exchange || ''}`;
      $('dPrice').innerHTML = `${money(s.price, cur)} <span class="cur">${cur}</span>`;
      const updated = s.updated ? new Date(s.updated * 1000).toLocaleString('en-US', { timeZone: tzFor(s), month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }) : '';
      const open = s.marketState === 'REGULAR';
      $('dNote').textContent = (open ? 'Market open' : 'Market closed') + (updated ? ` · prices fetched ${updated}` : '') + (s.stale ? ' · last update failed, showing older data' : '');

      const pct = v => v == null ? '—' : v.toFixed(2) + '%';
      const rows = [
        ['Open', money(s.open, cur)],
        ['High', money(s.dayHigh, cur)],
        ['Low', money(s.dayLow, cur)],
        ['Mkt cap', compact(s.marketCap, cur)],
        ['P/E ratio', s.pe == null ? '—' : s.pe.toFixed(2)],
        ['Div yield', pct(s.divYield)],
        ['52-wk high', money(s.yearHigh, cur)],
        ['52-wk low', money(s.yearLow, cur)],
        ['Volume', compact(s.volume)],
        ['Avg volume', compact(s.avgVolume)],
      ];
      $('stats').innerHTML = rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
      renderRange();
    }

    function pointsFor(s, range) {
      const daily = s.series['1Y'] || [];
      const now = Date.now() / 1000;
      if (range === '1D' || range === '5D' || range === '1Y' || range === '5Y') return s.series[range] || [];
      if (range === '1M') return daily.filter(p => p[0] >= now - 31 * 86400);
      if (range === '6M') return daily.filter(p => p[0] >= now - 183 * 86400);
      if (range === 'YTD') {
        const y = new Date().getFullYear();
        const start = Date.UTC(y, 0, 1) / 1000;
        return daily.filter(p => p[0] >= start);
      }
      return [];
    }

    function renderRange() {
      const s = state.current, r = state.range;
      document.querySelectorAll('.ranges button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.r === r)));
      const pts = pointsFor(s, r);
      state.points = pts;
      state.hover = -1;
      // 1D compares with yesterday's close; longer ranges with their first point
      const base = r === '1D' ? s.prevClose : (pts[0] ? pts[0][1] : s.price);
      const change = s.price - base, pct = base ? (s.price / base - 1) * 100 : 0;
      const label = { '1D': 'today', '5D': 'past 5 days', '1M': 'past month', '6M': 'past 6 months', 'YTD': 'year to date', '1Y': 'past year', '5Y': 'past 5 years' }[r];
      const mv = $('dMove');
      mv.className = 'move ' + dirOf(change);
      mv.innerHTML = `${moveText(change, pct, s.currency)}<span class="when">${label}</span>`;
      $('chart').className = 'chart ' + (dirOf(change) || 'up');
      drawChart(base);
    }

    // ---------- chart ----------
    const svg = $('svg'), tip = $('tip'), chartBox = $('chart');
    const NS = 'http://www.w3.org/2000/svg';
    let geom = null, lastBase = null;

    function el(name, attrs, parent) {
      const e = document.createElementNS(NS, name);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    }

    function niceTicks(lo, hi, count) {
      const raw = (hi - lo) / count;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw);
      const out = [];
      for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
      return out;
    }

    function timeLabel(ts, r, tz) {
      const d = new Date(ts * 1000);
      const o = { timeZone: tz };
      if (r === '1D') return d.toLocaleTimeString('en-US', { ...o, hour: 'numeric', minute: '2-digit' });
      if (r === '5D') return d.toLocaleDateString('en-US', { ...o, weekday: 'short' });
      if (r === '5Y') return d.toLocaleDateString('en-US', { ...o, year: 'numeric' });
      if (r === '1Y' || r === '6M' || r === 'YTD') return d.toLocaleDateString('en-US', { ...o, month: 'short', year: '2-digit' });
      return d.toLocaleDateString('en-US', { ...o, month: 'short', day: 'numeric' });
    }

    function tipTime(ts, r, tz) {
      const d = new Date(ts * 1000);
      const intraday = r === '1D' || r === '5D';
      return d.toLocaleString('en-US', intraday
        ? { timeZone: tz, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }
        : { timeZone: tz, month: 'short', day: 'numeric', year: 'numeric' });
    }

    function drawChart(base) {
      lastBase = base;
      const s = state.current, pts = state.points, r = state.range;
      svg.innerHTML = '';
      geom = null;
      const W = svg.clientWidth, H = svg.clientHeight;
      if (!W || pts.length < 2) {
        if (W) el('text', { class: 'tick', x: W / 2, y: H / 2, 'text-anchor': 'middle' }, svg).textContent = 'No chart data for this range yet.';
        return;
      }
      const vals = pts.map(p => p[1]);
      let lo = Math.min(...vals), hi = Math.max(...vals);
      if (r === '1D' && s.prevClose) { lo = Math.min(lo, s.prevClose); hi = Math.max(hi, s.prevClose); }
      const pad = (hi - lo || hi * 0.01) * 0.08;
      lo -= pad; hi += pad;
      const yt = niceTicks(lo, hi, 4);
      const labelW = Math.max(...yt.map(t => money(t, s.currency).length)) * 6.8 + 10;
      const m = { l: labelW, r: 10, t: 10, b: 26 };
      // Points are spaced evenly, so nights and weekends don't leave gaps
      const x = i => m.l + i / (pts.length - 1) * (W - m.l - m.r);
      const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);

      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const grid = el('g', { class: 'grid' }, svg);
      for (const t of yt) {
        el('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }, grid);
        el('text', { class: 'tick', x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end' }, svg).textContent = money(t, s.currency);
      }

      // x labels: where the label text changes (new hour, day, month, year), thinned to fit
      const tz = tzFor(s);
      const marks = [];
      let prevLabel = null;
      pts.forEach((p, i) => {
        const lab = timeLabel(p[0], r, tz);
        const key = r === '1D' ? lab.replace(/:\d\d/, '') : lab;
        if (key !== prevLabel && i > 0) marks.push([i, r === '1D' ? new Date(p[0] * 1000).toLocaleTimeString('en-US', { timeZone: tz, hour: 'numeric' }) : lab]);
        prevLabel = key;
      });
      const maxLabels = Math.max(2, Math.floor((W - m.l - m.r) / 70));
      const every = Math.ceil(marks.length / maxLabels);
      marks.filter((_, k) => k % every === 0).forEach(([i, lab]) => {
        const px = x(i);
        if (px > W - m.r - 18) return;
        el('text', { class: 'tick', x: px, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = lab;
      });

      const P = pts.map((p, i) => [x(i), y(p[1])]);
      const line = 'M' + P.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
      el('path', { class: 'area', d: `${line}L${P[P.length - 1][0].toFixed(1)},${H - m.b}L${P[0][0].toFixed(1)},${H - m.b}Z` }, svg);

      if (r === '1D' && s.prevClose) {
        const py = y(s.prevClose);
        el('line', { class: 'prev', x1: m.l, x2: W - m.r, y1: py, y2: py }, svg);
        el('text', { class: 'prev-label', x: W - m.r, y: py - 5, 'text-anchor': 'end' }, svg).textContent = 'Prev close ' + money(s.prevClose, s.currency);
      }
      el('path', { class: 'series', d: line }, svg);

      const cross = el('line', { class: 'cross', y1: m.t, y2: H - m.b, visibility: 'hidden' }, svg);
      const dot = el('circle', { class: 'hover-dot', r: 5, visibility: 'hidden' }, svg);
      geom = { P, cross, dot, W, m };
    }

    function showHover(i) {
      if (!geom) return;
      state.hover = i;
      const s = state.current, p = state.points[i], [px, py] = geom.P[i];
      geom.cross.setAttribute('x1', px); geom.cross.setAttribute('x2', px);
      geom.cross.setAttribute('visibility', 'visible');
      geom.dot.setAttribute('cx', px); geom.dot.setAttribute('cy', py);
      geom.dot.setAttribute('visibility', 'visible');
      const ch = lastBase ? (p[1] / lastBase - 1) * 100 : 0;
      tip.innerHTML = `<div class="v">${money(p[1], s.currency)} ${s.currency}</div>` +
        `<div class="v" style="color:var(--${ch >= 0 ? 'up' : 'down'})">${signed(ch, v => v.toFixed(2))}%</div>` +
        `<div class="t">${tipTime(p[0], state.range, tzFor(s))}</div>`;
      tip.hidden = false;
      const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, px + 14 + tw > geom.W ? px - 14 - tw : px + 14) + 'px';
    }

    function hideHover() {
      state.hover = -1;
      tip.hidden = true;
      if (!geom) return;
      geom.cross.setAttribute('visibility', 'hidden');
      geom.dot.setAttribute('visibility', 'hidden');
    }

    function pointer(e) {
      if (!geom) return;
      const rect = svg.getBoundingClientRect();
      const n = state.points.length;
      const i = Math.round((e.clientX - rect.left - geom.m.l) / (geom.W - geom.m.l - geom.m.r) * (n - 1));
      showHover(Math.max(0, Math.min(n - 1, i)));
    }
    svg.addEventListener('pointermove', pointer);
    svg.addEventListener('pointerdown', pointer);
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideHover(); });
    svg.addEventListener('blur', hideHover);
    svg.addEventListener('keydown', e => {
      const n = state.points.length;
      if (!n) return;
      let i = state.hover < 0 ? n - 1 : state.hover;
      if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
      else if (e.key === 'ArrowRight') i = Math.min(n - 1, i + 1);
      else if (e.key === 'Home') i = 0;
      else if (e.key === 'End') i = n - 1;
      else if (e.key === 'Escape') { hideHover(); return; }
      else return;
      e.preventDefault();
      showHover(i);
    });
    new ResizeObserver(() => { if (state.current) drawChart(lastBase); }).observe(chartBox);

    document.querySelectorAll('.ranges button').forEach(b => b.addEventListener('click', () => {
      state.range = b.dataset.r;
      save('stocks:range', state.range);
      renderRange();
    }));
    window.addEventListener('hashchange', () => {
      selectFromHash();
      // On narrow screens the list sits under the chart, so bring the chart into view
      if (matchMedia('(max-width: 860px)').matches) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    fetchData();
    // Pick up new prices while the page stays open
    setInterval(() => { if (document.visibilityState === 'visible') fetchData(); }, 5 * 60 * 1000);
  </script>
</body>
</html>
