  <style>
    :root { --bg: #fbf6ee; --paper: #fffdf8; --ink: #33261a; --muted: #8a7560; --accent: #b4470c; --border: #efe2cf; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #17120d; --paper: #1f1812; --ink: #f1e4d1; --muted: #b39b80; --accent: #f08a3c; --border: #3a2c1f; --on-accent: #1a110a; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #17120d; --paper: #1f1812; --ink: #f1e4d1; --muted: #b39b80; --accent: #f08a3c; --border: #3a2c1f; --on-accent: #1a110a; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font-family: system-ui, -apple-system, sans-serif; font-size: 16px;
           padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
    form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    input { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { font: inherit; font-weight: 600; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: var(--on-accent); cursor: pointer; }
    .err { color: var(--accent); }
  </style>
</head>

    const KEY_STORE = 'sadhana:key';
    const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    function load() { try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; } }
    function save(v) { try { localStorage.setItem(KEY_STORE, v); } catch (e) {} }
    function forget() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }

    async function decrypt(rawKey) {
      const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(ENC.iv) }, key, bytes(ENC.data));
      return new TextDecoder().decode(plain);
    }

    function show(html) {
      document.open();
      document.write(html);
      document.close();
    }

    async function fromPassphrase(pass) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(ENC.salt), iterations: ENC.iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      return new Uint8Array(await crypto.subtle.exportKey('raw', key));
    }

    const form = document.getElementById('unlock');
    const err = document.getElementById('err');
    const go = document.getElementById('go');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.hidden = true;
      go.disabled = true;
      go.textContent = 'Unlocking…';
      try {
        const raw = await fromPassphrase(document.getElementById('pass').value);
        const html = await decrypt(raw);
        save(btoa(String.fromCharCode(...raw)));
        show(html);
      } catch (e2) {
        err.hidden = false;
        go.disabled = false;
        go.textContent = 'Unlock';
      }
    });

    (async () => {
      const stored = load();
      if (stored) {
        try { show(await decrypt(bytes(stored))); return; } catch (e) { forget(); }
      }
      form.hidden = false;
      document.getElementById('pass').focus();
    })();
  </script>
